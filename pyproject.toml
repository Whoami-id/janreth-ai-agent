[project]
name = "janreth"
version = "0.1.0"
description = "Janreth — a secure-by-default Python agent framework. Security controls are on by default, and each one ships with a runnable attack the framework blocks."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai>=1.50.0",
    "anthropic>=0.40.0",
    "litellm>=1.83.7",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "tavily-python>=0.5.0",
    "mcp>=1.0.0",
    "fastmcp>=0.1.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "tiktoken>=0.7.0",
    "chromadb>=0.5.0",
    "e2b-code-interpreter>=1.0.0",
    "pandas>=2.0",
    "openpyxl>=3.1.0",
    "pymupdf>=1.24.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
